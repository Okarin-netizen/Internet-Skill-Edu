<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>インターネットとAIを学ぶ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/ui.css">
</head>
<body>
<main class="app" id="app" lang="ja">
  <header class="portal-head">
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
  </header>
</main>
<script src="assets/units.js"></script>
<script src="assets/engine.js"></script>
<script>
(function () {
  var R = Unit.R;
  document.getElementById("title").innerHTML = R("インターネットとAIを{学|まな}ぶ");
  document.getElementById("lead").innerHTML = R("{学|まな}びたい{単元|たんげん}を{選|えら}んでください。1つの{単元|たんげん}は{約|やく}10{分|ぷん}です。");
  var app = document.getElementById("app");
  CATALOG.forEach(function (t) {
    var sec = document.createElement("section");
    sec.className = "theme";
    sec.innerHTML = '<h2><span class="code">' + t.code + "</span><span>" + R(t.name) + '</span></h2><div class="unit-list"></div>';
    var list = sec.querySelector(".unit-list");
    t.units.forEach(function (u) {
      var a = document.createElement("a");
      a.className = "unit-link";
      a.href = "units/" + u.dir + "/index.html";
      a.innerHTML = '<span class="code">' + u.code + "</span><b>" + R(u.title) + '</b><span class="desc">' + R(u.desc) + '</span><span class="time">' + R("{約|やく}10{分|ぷん}") + "</span>";
      list.appendChild(a);
    });
    app.appendChild(sec);
  });
})();
</script>
</body>
</html>
