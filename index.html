<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>インターネットとAIのしくみ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@800&display=swap">
<style>
:root { --bg: #EAF1F7; --surface: #FFFFFF; --ink: #1B2740; --muted: #55627A; --line: #B9C7D8; --accent: #E8590C; }
@media (prefers-color-scheme: dark) { :root { --bg: #121A28; --surface: #1C2638; --ink: #EEF2F8; --muted: #A8B4C8; --line: #3A4A63; --accent: #FF8A4C; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "BIZ UDPGothic", sans-serif; font-size: 22px; line-height: 1.9; }
main { max-width: 900px; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: "M PLUS Rounded 1c", sans-serif; margin: 0; }
rt { font-size: 0.5em; }
a.unit, div.unit { display: block; background: var(--surface); border: 4px solid var(--line); border-radius: 20px; padding: 20px 24px; color: inherit; text-decoration: none; font-weight: 700; }
a.unit { border-color: var(--accent); }
div.unit { color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<main>
  <h1>インターネットと AIの しくみ</h1>
  <a class="unit" href="units/a1-message/">A1 メッセージが とどくまで</a>
  <div class="unit">A2 ちいさく <ruby>分<rt>わ</rt></ruby>けて おくる（じゅんびちゅう）</div>
  <div class="unit">A3 ウェブページは どこに ある？（じゅんびちゅう）</div>
  <div class="unit">A4 <ruby>一度<rt>いちど</rt></ruby> <ruby>出<rt>だ</rt></ruby>したら もどらない（じゅんびちゅう）</div>
</main>
</body>
</html>
