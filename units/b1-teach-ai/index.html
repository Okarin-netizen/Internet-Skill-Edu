<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<main class="app" id="app" lang="ja"></main>
<script src="../../assets/units.js"></script>

<script>
var ui = Unit.ui;
Unit.run({
  code: "B1",

    test: [
      { kind: "cat", ear: 1, light: 0.8 }, { kind: "dog", ear: 0, light: 0.25 }, { kind: "cat", ear: 1, light: 0.3 }, { kind: "fox", ear: 1, light: 0.5 }

    texts: {
      teach: "AIに{教|おし}えるための{写真|しゃしん}です。1{枚|まい}ずつ、ねこか{犬|いぬ}の{箱|はこ}に{分|わ}けてください。",

    }
  },
  quiz: [
    {
      q: "AIは、どうやって{見分|みわ}けられるようになったでしょうか。",
      options: [
        { t: "{最初|さいしょ}から{全部|ぜんぶ}{知|し}っていた" },
        { t: "{人|ひと}が{分|わ}けた{例|れい}から{学|まな}んだ", correct: true },
        { t: "インターネットで{答|こた}えを{調|しら}べた" }

      right: "{正解|せいかい}です。AIは{例|れい}（データ）から{学|まな}びます。",

    {

      options: [
        { t: "きつねは、ねこの{仲間|なかま}だから" },
        { t: "きつねを{教|おし}えていないので、{知|し}っているものの{中|なか}でいちばん{似|に}ている「ねこ」を{選|えら}んだから", correct: true },
        { t: "AIがわざとまちがえたから" }
      ],
      right: "{正解|せいかい}です。AIは「{分|わ}からない」と{言|い}わずに、それらしい{答|こた}えを{出|だ}すことがあります。",

      right: "{正解|せいかい}です。{教|おし}える{例|れい}がまちがっていると、AIもまちがえて{学|まな}びます。",
      wrong: "AIは、{教|おし}えられたとおりに{学|まな}びます。"

  summary: {
