<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D3 言葉の伝わり方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="../../assets/ui.css">
</head>
<body>
<main class="app" id="app" lang="ja"></main>
<script src="../../assets/units.js"></script>
<script src="../../assets/engine.js"></script>
<script>
var ui = Unit.ui;
Unit.run({
  code: "D3",
  lead: "{文字|もじ}だけのメッセージは、{相手|あいて}にどう{伝|つた}わるでしょうか。どう{書|か}けば{気持|きも}ちが{伝|つた}わるでしょうか。",
  activity: {
    type: "judge",
    prompt: "このメッセージは、{相手|あいて}にどう{伝|つた}わるでしょうか。",
    hint: "{顔|かお}や{声|こえ}が{見|み}えないとき、{相手|あいて}はこの{文字|もじ}だけを{読|よ}みます。{相手|あいて}の{気持|きも}ちになって{考|かんが}えましょう。",
    cards: [
      { html: ui.chat("Aさん →「{明日|あした}{遊|あそ}ぼう」への、Bさんの{返事|へんじ}", "いいよ。", "person"),
        options: ["{必|かなら}ずうれしいと{思|おも}う", "「{本当|ほんとう}は{行|い}きたくないのかな」と{不安|ふあん}になるかもしれない", "{何|なに}も{感|かん}じない"], answer: 1,
        why: "{短|みじか}い「いいよ。」は、{冷|つめ}たく{感|かん}じられることがあります。" },
      { html: ui.chat("Aさん →「{明日|あした}{遊|あそ}ぼう」への、Bさんの{返事|へんじ}", "{別|べつ}にいいけど", "person"),
        options: ["{楽|たの}しみにしていると{思|おも}う", "「いやなのかな」「おこっているのかな」と{思|おも}うかもしれない", "{行|い}けないと{思|おも}う"], answer: 1,
        why: "「{別|べつ}に」は、{本人|ほんにん}にそのつもりがなくても、いやそうに{伝|つた}わりやすい{言葉|ことば}です。" },
      { html: ui.chat("グループトークで、Cさんが{描|か}いた{絵|え}を{見|み}せたあと", "なにこれｗ", "person"),
        options: ["ほめられたと{思|おも}う", "ばかにされたと{感|かん}じるかもしれない", "{絵|え}をもっと{見|み}せたくなる"], answer: 1,
        why: "{書|か}いた{人|ひと}は{面白|おもしろ}がっただけでも、ばかにされたと{感|かん}じることがあります。{大勢|おおぜい}が{見|み}るグループでは、とくに{気|き}をつけます。" },
      { html: ui.scene("chat", "{明日|あした}は{用事|ようじ}があって{遊|あそ}べません。どう{返事|へんじ}をしますか。"),
        options: ["「むり」", "「ごめん、{明日|あした}は{用事|ようじ}があるんだ。また{今度|こんど}さそってね」", "{読|よ}んだまま{返事|へんじ}をしない"], answer: 1,
        why: "{断|ことわ}る{理由|りゆう}と、また{遊|あそ}びたい{気持|きも}ちを{言葉|ことば}で{足|た}すと、{相手|あいて}も{安心|あんしん}できます。",
        hint: "{断|ことわ}られた{相手|あいて}が、どう{感|かん}じるかを{考|かんが}えましょう。" }
    ],
    after: "{同|おな}じ{言葉|ことば}でも、{書|か}き{方|かた}で{伝|つた}わり{方|かた}が{変|か}わります。{顔|かお}や{声|こえ}が{見|み}えない{分|ぶん}、{気持|きも}ちを{言葉|ことば}で{足|た}し、{送|おく}る{前|まえ}に{読|よ}み{返|かえ}しましょう。"
  },
  quiz: [
    {
      q: "{文字|もじ}で{気持|きも}ちを{伝|つた}えるために、できることはどれでしょうか。",
      options: [
        { t: "できるだけ{短|みじか}く{送|おく}る" },
        { t: "{気持|きも}ちを{表|あらわ}す{言葉|ことば}をつけ{足|た}す", correct: true },
        { t: "{返事|へんじ}をしない" }
      ],
      right: "{正解|せいかい}です。",
      wrong: "{短|みじか}い「いいよ。」は、{冷|つめ}たく{感|かん}じることがありましたね。"
    },
    {
      q: "{文字|もじ}のやりとりで{誤解|ごかい}が{起|お}きやすいのは、なぜでしょうか。",
      options: [
        { t: "{表情|ひょうじょう}や{声|こえ}の{調子|ちょうし}が{伝|つた}わらないから", correct: true },
        { t: "{漢字|かんじ}が{難|むずか}しいから" },
        { t: "{文字|もじ}は{速|はや}く{届|とど}くから" }
      ],
      right: "{正解|せいかい}です。{会|あ}って{話|はな}すときは、{顔|かお}や{声|こえ}で{気持|きも}ちが{伝|つた}わっています。",
      wrong: "{会|あ}って{話|はな}すときと、{何|なに}がちがうでしょうか。"
    },
    {
      q: "{送|おく}ったメッセージで{相手|あいて}がいやな{気持|きも}ちになったようです。どうしますか。",
      options: [
        { t: "そんなつもりはなかったので、{気|き}にしない" },
        { t: "{誤解|ごかい}させたことをあやまり、{本当|ほんとう}の{気持|きも}ちを{言葉|ことば}で{伝|つた}え{直|なお}す", correct: true },
        { t: "メッセージを{消|け}してなかったことにする" }
      ],
      right: "{正解|せいかい}です。{会|あ}って{話|はな}すのもよい{方法|ほうほう}です。",
      wrong: "{相手|あいて}の{気持|きも}ちは、そのままでは{直|なお}りません。"
    }
  ],
  summary: {
    headline: "{文字|もじ}だけでは{気持|きも}ちが{伝|つた}わりにくいので、{言葉|ことば}を{足|た}し、{送|おく}る{前|まえ}に{相手|あいて}の{気持|きも}ちで{読|よ}み{返|かえ}します。",
    words: [
      { icon: "chat", term: "{文字|もじ}のやりとり", desc: "{表情|ひょうじょう}や{声|こえ}が{伝|つた}わらないコミュニケーション" },
      { icon: "search", term: "{読|よ}み{返|かえ}す", desc: "{送|おく}る{前|まえ}に、{相手|あいて}の{気持|きも}ちになって{読|よ}んでみること" }
    ]
  }
});
</script>

</html>
