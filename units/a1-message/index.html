<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A1 メッセージが届くまで</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="../../assets/ui.css">
</head>
<body>
<main class="app" id="app" lang="ja"></main>
<script src="../../assets/units.js"></script>
<script src="../../assets/engine.js"></script>
<script>
var ui = Unit.ui;
Unit.run({
  code: "A1",
  lead: "{友|とも}だちに{送|おく}ったメッセージは、どこを{通|とお}って{届|とど}くのでしょうか。{実際|じっさい}に{送|おく}って{確|たし}かめてみましょう。",
  activity: {
    type: "relay",
    pick: { prompt: "{送|おく}るメッセージを1つ{選|えら}んでください。", options: ["りょうかい", "ありがとう", "また{明日|あした}"] },
    nodes: [
      { icon: "tablet", label: "{自分|じぶん}のタブレット" },
      { icon: "router", label: "{Wi-Fi|ワイファイ}ルーター" },
      { icon: "server", label: "サーバー", sub: "インターネットの{先|さき}" },
      { icon: "tabletMsg", label: "{友|とも}だちのタブレット" }
    ],
    texts: [
      "メッセージを{送|おく}ります。{光|ひか}っているところをタッチしてください。",
      "{Wi-Fi|ワイファイ}ルーターに{着|つ}きました。ルーターは、{学校|がっこう}のネットワークの{出入|でい}り{口|ぐち}です。{次|つぎ}もタッチしてください。",
      "サーバーに{着|つ}きました。サーバーは、メッセージを{預|あず}かって{相手|あいて}に{渡|わた}すコンピューターです。{最後|さいご}に{友|とも}だちのタブレットをタッチしてください。",
      "{友|とも}だちに{届|とど}きました。メッセージはリレーして{届|とど}いたことが{分|わ}かります。"
    ]
  },
  quiz: [{
    q: "メッセージはどうやって{届|とど}いたでしょうか。",
    options: [
      { t: "タブレットから{友|とも}だちのタブレットへ、{直接|ちょくせつ}{届|とど}いた" },
      { t: "ルーターやサーバーを{中継|ちゅうけい}して{届|とど}いた", correct: true }
    ],
    right: "{正解|せいかい}です。メッセージは、ルーターやサーバーを{中継|ちゅうけい}して{届|とど}きます。",
    wrong: "{途中|とちゅう}でルーターとサーバーを{通|とお}りました。もう{一方|いっぽう}を{選|えら}んでみましょう。"
  }],
  summary: {
    headline: "メッセージは、いくつもの{機械|きかい}をリレーして{届|とど}きます。",
    words: [
      { icon: "router", term: "ルーター", desc: "{学校|がっこう}や{家|いえ}のネットワークの{出入|でい}り{口|ぐち}" },
      { icon: "server", term: "サーバー", desc: "メッセージを{預|あず}かって、{相手|あいて}に{渡|わた}すコンピューター" }
    ]
  }
});
</script>
</body>
</html>
